[project]
name = "isaac-so-arm101"
version = "1.2.0"
description = "Reinforcement Learning with the SO-ARM100 / SO-ARM101 in Isaac Lab"
readme = "README.md"
authors = [
    { name = "Louis Le Lay", email = "le.lay.louis@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "einops>=0.8.1",
    "huggingface_hub>=0.25.0",
    "isaacsim[all,extscache]==6.1.0.0",
    "opencv-python>=4.11.0.86",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[project.optional-dependencies]
# OpenVLA pins stay on the Python 3.11 / Lab 2.3 / Sim 5.1 venv (.venv-isaacsim-5.1).
# Default uv sync targets teleop (Python 3.12 + Sim 6.1) and must not pull these.
vla = [
    "accelerate==1.1.1",
    "bitsandbytes>=0.49.2",
    "timm==0.9.10",
    "tokenizers==0.19.1",
    "transformers==4.40.1",
]

[project.scripts]
train = "isaac_so_arm101.scripts.rsl_rl.train:main"
play = "isaac_so_arm101.scripts.rsl_rl.play:main"
list_envs = "isaac_so_arm101.scripts.list_envs:main"
zero_agent = "isaac_so_arm101.scripts.zero_agent:main"
random_agent = "isaac_so_arm101.scripts.random_agent:main"
teleop = "isaac_so_arm101.scripts.teleop_keyboard:main"
fetch_assets = "isaac_so_arm101.scripts.fetch_assets:main"

# VLA training scripts
train_lora = "isaac_so_arm101.scripts.vla.training.train_lora:main"
train_full = "isaac_so_arm101.scripts.vla.training.train_full:main"

# VLA inference script
infer = "isaac_so_arm101.scripts.vla.inference.infer:main"

# VLA data generation scripts
record_dataset = "isaac_so_arm101.scripts.vla.data_generation.record_dataset:main"
generate_data = "isaac_so_arm101.scripts.vla.data_generation.generate_data:main"

# VLA dataset management scripts
prepare_data = "isaac_so_arm101.scripts.vla.dataset_management.prepare_data:main"
merge_datasets = "isaac_so_arm101.scripts.vla.dataset_management.merge_datasets:main"
push_to_hub = "isaac_so_arm101.scripts.vla.dataset_management.push_to_hub:main"

# Legacy VLA scripts (deprecated, use new names above)
vla_inference = "isaac_so_arm101.scripts.vla.inference.infer:main"
vla_data_gen_v2 = "isaac_so_arm101.scripts.vla.data_generation.generate_data:main"

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
environments = [
  "sys_platform == 'linux' and implementation_name == 'cpython' and python_version == '3.12'",
  "sys_platform == 'win32' and implementation_name == 'cpython' and python_version == '3.12'"
]

[[tool.uv.index]]
url = "https://pypi.nvidia.com/"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.extra-build-dependencies]
flatdict = ["setuptools<71"]

[build-system]
requires = ["uv_build>=0.8.21,<0.9.0"]
build-backend = "uv_build"